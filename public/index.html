<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG Document Assistant & Build & Deploy</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
    }

    nav {
      display: flex;
      gap: 1rem;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }

    .nav-btn.active, .nav-btn:hover {
      background-color: var(--primary);
      border-color: var(--primary);
    }

    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem;
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 2rem;
    }

    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    input[type="file"], textarea, input[type="text"] {
      width: 100%;
      padding: 0.75rem;
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      color: var(--text);
      font-family: inherit;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    button.btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1rem;
      border-radius: 0.375rem;
      cursor: pointer;
      font-weight: 500;
      width: 100%;
      transition: background-color 0.2s;
    }

    button.btn:hover {
      background-color: var(--primary-hover);
    }

    button.btn-danger {
      background-color: var(--danger);
    }

    button.btn-danger:hover {
      background-color: var(--danger-hover);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
      border-radius: 9999px;
      background: rgba(34, 197, 94, 0.2);
      color: var(--success);
    }

    .doc-list {
      list-style: none;
      max-height: 200px;
      overflow-y: auto;
    }

    .doc-item {
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.875rem;
      display: flex;
      justify-content: space-between;
    }

    .chat-container {
      display: flex;
      flex-direction: column;
      height: 500px;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message {
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      max-width: 80%;
    }

    .message.user {
      background-color: var(--primary);
      align-self: flex-end;
    }

    .message.assistant {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      align-self: flex-start;
      width: 100%;
      max-width: 100%;
    }

    .citation {
      margin-top: 0.5rem;
      padding-top: 0.5rem;
      border-top: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .citation pre {
      background: var(--bg);
      padding: 0.5rem;
      border-radius: 0.25rem;
      margin-top: 0.25rem;
      overflow-x: auto;
      white-space: pre-wrap;
    }

    .error-banner {
      background-color: rgba(239, 68, 68, 0.2);
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 0.75rem;
      border-radius: 0.375rem;
      margin-bottom: 1rem;
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>RAG Document Assistant</h1>
    <nav>
      <button class="nav-btn active" onclick="switchView('rag')">Document Q&A</button>
      <button class="nav-btn" onclick="switchView('build')">Build & Deploy</button>
    </nav>
  </header>

  <main>
    <div id="error-banner" class="error-banner"></div>

    <!-- RAG View -->
    <div id="rag-view" class="view active">
      <div class="grid">
        <div>
          <div class="card">
            <h2>Knowledge Base <span id="model-status" class="status-badge">Ollama Ready</span></h2>
            <div class="form-group">
              <label for="doc-file">Upload Document (TXT, MD, CSV, JSON, HTML, Code)</label>
              <input type="file" id="doc-file" accept=".txt,.md,.csv,.json,.html,.js,.ts,.py,.java,.c,.cpp,.h">
            </div>
